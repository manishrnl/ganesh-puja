spring:
  datasource:
    url: jdbc:h2:mem:ganesh_puja_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

jwt:
  secret: test-secret-key
  expirationMs: 3600000

app:
  file-storage-path: ./tmp/uploads
  cors-allowed-origins: http://localhost:5173

mail:
  host: localhost
  port: 1025
  username: test
  password: test

payment:
  gateway:
    key-id: test-key-id
    key-secret: test-key-secret
