spring:
  application:
    name: andah-ganesh-puja
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/andah-ganesh-puja}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Manish@2009}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  main:
    banner-mode: off

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:dev-secret-key}
  expirationMs: ${JWT_EXPIRATION_MS:3600000}

app:
  file-storage-path: ${FILE_STORAGE_PATH:./uploads}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}
  username: ${MAIL_USERNAME:dev}
  password: ${MAIL_PASSWORD:dev}

payment:
  gateway:
    key-id: ${PAYMENT_GATEWAY_KEY_ID:test-key-id}
    key-secret: ${PAYMENT_GATEWAY_KEY_SECRET:test-key-secret}

logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5p) %clr([%15.15t]){cyan} %clr(%-40.40logger{39}){magenta} : %clr(%m){green}%n"
